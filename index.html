<!DOCTYPE html>
<html lang="Pt-Br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="cabecalho">
        <div class="container-cabecalho">
            <img src="icon/Logo-raiozinho.png" alt="">
            <nav class="menu">
                <a href="" class="texto-nav">Pneus</a>
                <a href="" class="texto-nav">Customizacao</a>
                <a href="" class="texto-nav">Caminhao</a>
                <a href="" class="texto-nav">Pecas Diversas</a>
                <a href="" class="texto-nav">Esportivos</a>
            </nav>
            <button class="usuario">Usuario</button>
        </div>
    </header>
    <main>
        <section class="lista-carrinho">
            <ul class="carrinho">
                <li class="produto">
                    <img src="icon/Imagem-bgc.png" alt="Imagem teste">
                    <div class="informacoes-carrinho">
                        <p>Descricao produto</p>
                        <button class="botao-excluir">
                            <img src="icon/Vector.png" alt="" class="lixeira">Adicionar ao carrinho
                        </button>
                    </div>
                </li>
            </ul>
        </section>
    </main>
</body>

</html>
