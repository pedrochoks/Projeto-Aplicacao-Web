<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="styles/Style.CSS">
</head>

<body>
    <header class="cabecalho">
        <div class="container-cabecalho">
            <div class="texto-cabecalho">
                <h1 class="Cadastro">Cadastro</h1>
                <p class="texto">Crie uma nova conta de usuario no Katchau</p>
            </div>
            <img src="icon/Logo-raiozinho.png" alt="" class="raio-cabecalho">
        </div>
    </header>

    <main>
        <div class="inputs">
            <section class="input-esquerda">
                <div class="input">
                    <h3 class="nomeCompleto">Nome Completo</h3>
                    <input type="text">
                </div>
                <div class="input">
                    <h3>E-mail</h3>
                    <input type="email">
                </div>
                <div class="input">
                    <h3>CPF</h3>
                    <input type="text">
                </div>
                <div class="input">
                    <h3>Rua</h3>
                    <input type="text">
                </div>
                <div class="input">
                    <h3>Estado</h3>
                    <input type="text">
                </div>
            </section>
            <aside class="input-direita">
                <div class="input">
                    <h3>Telefone</h3>
                    <input type="text">
                </div>
                <div class="input">
                    <h3>Senha</h3>
                    <input type="password">
                </div>
                <div class="input">
                    <h3>Confirmar Senha</h3>
                    <input type="password">
                </div>
                <div class="input">
                    <h3>Cidade</h3>
                    <input type="text">
                </div>
                <div class="input">
                    <h3>Numero da casa</h3>
                    <input type="number">
                </div>
            </aside>
        </div>
        <div class="botoes">
            <button class="entrar ">Entrar</button>
           <button class="voltar"><U>Voltar</U></button>
        </div>
    </main>
</body>

</html>
