<!DOCTYPE html>
<html lang="Pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Produto</title>
    <link rel="stylesheet" href="styles/cadastroProduto.css">
</head>

<body>
    <header>
        <nav class="area-vermelha">
            <div class="container-nav">
                <img src="Icon/-B3EBF2 (1) 2.svg" class="logo-raio" alt="Raiozinho-nav">
                <div class="usuario">
                    <img src="Icon/Group 143.png" class="foto-usuario" alt="">
                    <p class="usuario">Usuario</p>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <div class="alinhar-fundo">
            <section class="area-cadastro">
                <div class="lado-imagem">
                    <img src="Icon/Rectangle 194.png" alt="">
                    <input type="file">
                </div>
                <aside class="informacoes-produto">
                    <h3>Nome Produto :</h3>
                    <input type="text" name="" id="">
                    <div class="preco-categoria">
                        <div class="preco">
                            <h3>Preco:</h3>
                            <input type="text">
                        </div>
                        <div class="categoria">
                            <h3>Categoria:</h3>
                            <input type="text">
                        </div>
                    </div>
                    <h3>Descricao</h3>
                    <input type="text" class="descricao-input">
                    <button class="cadastrar">Cadastrar Produto</button>
                </aside>
            </section>
        </div>
    </main>
</body>

</html>
