<!DOCTYPE html>
<html lang="Pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="styles/Style.CSS">
</head>

<body>
    <header class="cabecalho">
        <img src="icon/Logo-raiozinho.png" alt="">
    </header>
    <main>
        <div class="alinhar-fundo">
            <div class="fundo-cadastro">
                <img src="icon/Logo-completo-marrom.png" alt="">
                <p class="texto-cadastro">Cadastre-se e venha fazer parte da rota 66</p>
                <section class="input-esquerda">
                    <div class="input">
                        <h3>Nome de Usuario:</h3>
                        <input type="text">
                    </div>
                    <div class="input">
                        <h3>CPF:</h3>
                        <input type="text">
                    </div>
                    <div class="input">
                        <h3>Rua:</h3>
                        <input type="text">
                    </div>
                    <div class="input">
                        <h3>Senha:</h3>
                        <input type="password" placeholder="********">
                    </div>
                </section>
                <aside class="input-direita">
                    <div class="input">
                        <h3>E-mail:</h3>
                        <input type="email">
                    </div>
                    <div class="input">
                        <h3>Telefone:</h3>
                        <input type="text">
                    </div>
                    <div class="input">
                        <h3>Cidade:</h3>
                        <input type="text">
                    </div>
                    <div class="input">
                        <h3>Confirme sua Senha:</h3>
                        <input type="password">
                    </div>
                </aside>
                <button class="cadastrar">Cadastrar</button>
            </div>
        </div>
    </main>
</body>

</html>
