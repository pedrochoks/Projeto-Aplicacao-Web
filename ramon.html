<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto KATCHAU</title>
  <link rel="stylesheet" href="styles/ramon.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <header class="cabecalho">
    <img class="logo" src="img-ramon/-B3EBF2 (1) 1.png" alt="Logo Katchau">
    <nav class="menu">
      <a href="#">Pneus</a>
      <a href="#">Caminhões</a>
      <a href="#">Esportivos</a>
      <a href="#">Customizações</a>
    </nav>
    <button class="botao-entrar">Entrar</button>
  </header>

  <section class="banner"></section>

  <main class="conteudo">

    <section class="produtos" id="lista-produtos">
    </section>

    <aside class="filtros">
      <h2>Filtros</h2>

      <div class="filtro-preco">
        <h3>Preço</h3>
        <h1>Maior que</h1>
        <input type="number" id="min-preco" placeholder="R$ 0">

        <h1>Menor que</h1>
        <input type="number" id="max-preco" placeholder="R$ 10000">
      </div>

      <div class="filtro-grupo">
        <div class="filtro-departamentos" id="opcoes-departamentos">
          <h3>Departamentos</h3>
          <label><input type="checkbox" value="Low Rider"> Low Rider</label><br>
          <label><input type="checkbox" value="Adesivos"> Adesivos</label><br>
          <label><input type="checkbox" value="LEDs"> LEDs</label><br>
          <label><input type="checkbox" value="Tintas"> Tintas</label>
        </div>
      </div>

      <button id="filtrar">Aplicar Filtros</button>
    </aside>

  </main>

  <footer class="rodape">
    <p>© 2025 Projeto Katchau</p>
  </footer>

  <script src="scripts/scripts.js"></script>

</body>
</html>
